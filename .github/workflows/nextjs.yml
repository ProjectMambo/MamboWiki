name: Deploy MamboWiki to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - name: Checkout MamboWiki
        uses: actions/checkout@v4
        with:
          path: MamboWiki

      - name: Checkout MamboSite
        uses: actions/checkout@v4
        with:
          repository: ProjectMambo/MamboSite
          ref: b5e1c95964c4285a8b53235681bf24f720ee7e4a
          path: MamboSite

      - name: Checkout MamboDocs
        uses: actions/checkout@v4
        with:
          repository: ProjectMambo/MamboDocs
          ref: 1e920d21f30870d5a6c280621a49e22c3b9310aa
          path: MamboDocs

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            MamboSite/package-lock.json
            MamboWiki/package-lock.json

      - name: Install MamboSite dependencies
        run: npm ci
        working-directory: MamboSite

      - name: Install MamboWiki dependencies
        run: npm ci
        working-directory: MamboWiki

      - name: Install MamboSite command
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" MAMBOSITE_BIN_DIR="$RUNNER_TEMP/bin" ./MamboSite/script/install.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check MamboWiki
        run: npm run check
        working-directory: MamboWiki

      - name: Build production artifact
        run: npm run build
        working-directory: MamboWiki

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: MamboWiki/out

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
