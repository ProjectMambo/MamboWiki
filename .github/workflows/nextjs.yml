name: Deploy MamboWiki to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MamboWiki
        uses: actions/checkout@v4
        with:
          path: MamboWiki

      - name: Checkout MamboSite
        uses: actions/checkout@v4
        with:
          repository: ProjectMambo/MamboSite
          ref: 43f861f6f4a0f1504753faf4b6113e2e75636f59
          path: MamboSite

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            MamboSite/package-lock.json
            MamboWiki/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install MamboSite dependencies
        run: npm ci
        working-directory: MamboSite

      - name: Install MamboWiki dependencies
        run: npm ci
        working-directory: MamboWiki

      - name: Build static site with MamboSite
        run: >-
          cargo run --locked --quiet
          --manifest-path MamboSite/Cargo.toml
          --package mambosite-cli --
          --config MamboWiki/mambo.toml build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: MamboWiki/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
