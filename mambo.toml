schema = 1
content_root = "docs"
entry = "index.md"
typescript_out = "src/generated/mambo"
assets_out = "public/mambo"

[site]
title = "Project Mambo Wiki"
url = "https://projectmambo.org"
base_path = ""
trailing_slash = true
language = "en-SG"

[markdown]
raw_html = false
strict_links = true
max_embed_depth = 16

[frontmatter]
strict = true
ignored_fields = []
legacy_data_fields = []

[renderer]
enabled = true
kind = "next"
package_manager = "npm"
build_script = "mambosite:render"
output_dir = "out"

[deploy]
remote = "origin"
branch = "main"
workflow = ".github/workflows/nextjs.yml"
